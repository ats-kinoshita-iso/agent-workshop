[project]
name = "agent-workshop"
version = "0.1.0"
description = "Plugin library and development framework for Claude Code"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
# Exclude imported Anthropic skill scripts — upstream code we don't modify.
exclude = [
    "plugins/anthropic-*/skills/*/scripts/**",
    "plugins/anthropic-*/skills/*/core/**",
    "plugins/anthropic-*/skills/*/eval-viewer/**",
    "plugins/anthropic-*/skills/*/examples/**",
]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
# Exclude imported Anthropic skill scripts from type checking.
exclude = [
    "plugins/anthropic-.*/skills/.*/scripts/",
    "plugins/anthropic-.*/skills/.*/core/",
    "plugins/anthropic-.*/skills/.*/eval-viewer/",
    "plugins/anthropic-.*/skills/.*/examples/",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
